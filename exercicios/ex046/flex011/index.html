<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            display: flex;
            background-color: lightsalmon;
        }

        div.item{
           background-color: lightblue;
           text-align: center;
           border: 1px solid black;
        }

        #i1{
            flex: 1 0 200px;
            /*shorthand flex:
                flex-grow: 1
                flex-shrink: 0
                flex-basis: 200px
            */
        }

        #i2{
            flex: initial
            /*configuração padrão:
                flex-grow: 0
                flex-shrink: 1
                flex-basis: auto
            */
        }

        #i3{
            flex: auto;
            /*
                flex-grow: 1
                flex-shrink: 1
                flex-basis: auto
            */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
    </div>
     
</body>

</html>
