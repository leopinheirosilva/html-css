<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumo Flex Box</title>
</head>
<body>
    <h1>Resumo sobre Flex Box</h1>
    <!--
        *item-pai:
            flex-direction (define a direção do container: row, row-reverse, column, column-reverse)
            flex-wrap (define a quebra do conteúdo dentro do container: wrap, wrap-reverse, nowrap)
            flex-flow (shorthand para: flex-direction + flex-wrap)

            justify-content (alinha os itens do eixo principal):
                flex-start, flex-end, center, space-between, space-evenly, space-around

            align-items (alinha os itens do eixo transversal):
                flex-start, flex-end, center, stretch

            align-content (define a forma em que os itens se alinham no eixo transversal quando o wrap é ativado):
                flex-start, flex-end, center, stretch, space-between, space-evenly, space-around

        *item-filho:
            order (ordena a ordem em que os itens serão mostrados no container)
            align-self (define o alinhamento de um item específico dentro do container)

            flex-grow (define o quanto um item irá se expandir: 0, 1, 2...)
            flex-shrink (define o quanto um item irá encolher: 0, 1, 2...)
            flex-basis (define a largura de um item dentro do container)
            flex (shortand para: flex-grow + flex-shrink + flex-basis )
    -->
</body>

</html>
