<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box 8</title>
    <style>
        div.container{
            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
            height: 400px;
            background-color: lightsalmon;
        }

        div.item{
           background-color: lightblue;
           padding: 20px;
           border: 1px solid black; 
        }

        #i1{
            align-self:flex-start;
        }

        #i2{
            align-self: auto;
        }
        
        #i3{
            align-self: center;
        }
        
        #i4{
            align-self: normal;
        }
        
        #i5{
            align-self: flex-end;
        }
        
        #i6{
            align-self: center;
        }
        
        #i7{
            align-self: stretch;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
     
</body>

</html>
