<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            display: flex;
            background-color: lightsalmon;
        }

        div.item{
           background-color: lightblue;
           text-align: center;
           border: 1px solid black;
           flex-basis: 300px;
        }

        #i1{
            flex-grow: 0;
            flex-shrink: 0;
        }

        #i2{
            flex-grow: 2; /*determina o quanto o item pode ampliar (0,1,2...)*/
            flex-shrink: 1; 
        }

        #i3{
            flex-grow: 1;
            flex-shrink: 2; /*determina o quanto o item pode encolher (0,1,2...)*/
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
    </div>
     
</body>

</html>
