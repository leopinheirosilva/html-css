<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            display: flex;
            background-color: lightsalmon;
        }

        div.item{
           background-color: lightblue;
           text-align: center;
           border: 1px solid black;
           flex-basis: 300px;
           flex-shrink: 1; /*determina se o item pode encolher ou não (0 ou 1)*/
           flex-grow: 0; /*determina se o item pode expandir ou não (0 ou 1)*/
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
    </div>
     
</body>

</html>
