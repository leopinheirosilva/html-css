<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Sexo</legend>

            <label for="sxmas">
                <input type="radio" name="sexo" id="sxmas" value="M" checked> Masculino
            </label>
            <br>
            <label for="sxfem">
                <input type="radio" name="sexo" id="sxfem" value="F"> Feminino
            </label>
            <!-- Todos os inputs "radio" devem possuir o mesmo name -->
        </fieldset>

        <fieldset>
            <legend>Esportes Favoritos</legend>

            <label for="iesfut">
                <input type="checkbox" name="esfut" id="iesfut"> Futebol
            </label> 
            <br>
            <label for="iesbas">
                <input type="checkbox" name="ebas" id="iesbas"> Basquete
            </label> 
            <br>
            <label for="iesnat">
                <input type="checkbox" name="esnat" id="iesnat"> Natação
            </label> 
            <br>
            <label for="iesten">
                <input type="checkbox" name="esten" id="iesten"> Tênis
            </label>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

</body>

</html>
