<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na pratica</title>
    <style>
        div.container{
            border: 3px solid blue;
            height: 250px;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto ;
            gap: 5px;   /*espaço entre um item e outro*/
            align-items: center;    /*alinha os itens no eixo vertical*/
            justify-items: start;  /*alinha os itens no eixo horizontal*/
            align-content: stretch;   /*alinha o conteudo no eixo vertical*/
            justify-content: space-evenly;  /*alinha o conteudo no eixo horizontal*/
            
        }

        div.item{
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
