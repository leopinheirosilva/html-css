<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na pratica</title>
    <style>
        div.container{
            border: 3px solid blue;
            height: 250px;
            display: grid;
            grid-template: repeat(3, auto) / repeat(3, auto); /* shorthand grid-template-rows + grid-template-columns*/
            grid-auto-rows: auto; /*define qual o tamanho de uma nova linha*/
            grid-auto-columns: 100px; /*define qual o tamanho de uma nova coluna*/
            gap: 5px;  
            place-items: stretch start; /*shorthand align-items + justify-items*/
            place-content: space-evenly center; /*shorthand align-content + justify-content*/  
        }

        div.item{
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
